<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobility Assist final logo</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f6;color:#18252a;margin:0;padding:24px}main{max-width:1000px;margin:auto;display:grid;gap:24px}section{background:#fff;border:1px solid #d9e2e3;border-radius:16px;padding:20px}h2{margin:0 0 12px;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.light,.dark{border-radius:12px;padding:28px;display:flex;align-items:center;justify-content:center;gap:28px}.light{background:#fff;border:1px solid #d9e2e3}.dark{background:#072c34}.lock{height:64px;width:auto;max-width:100%}.sizes{display:flex;gap:18px;align-items:end;margin-top:16px}@media(max-width:700px){.row{grid-template-columns:1fr}}</style>
<main>
<section><h2>Static logo</h2><div class="row"><div class="light"><img class="lock" src="logos/final/mobility-assist-logo.svg" alt="Mobility Assist"></div><div class="dark"><img class="lock" src="logos/final/mobility-assist-logo-inverted.svg" alt="Mobility Assist"></div></div>
<div class="sizes"><img src="logos/final/mobility-assist-mark.svg" style="width:96px" alt=""><img src="logos/final/mobility-assist-mark.svg" style="width:48px" alt=""><img src="logos/final/mobility-assist-mark.svg" style="width:32px" alt=""><img src="logos/final/mobility-assist-mark.svg" style="width:16px" alt=""></div></section>
<section><h2>Animated logo</h2><div class="row"><div class="light"><img class="lock" src="logos/final/mobility-assist-logo-animated.svg" alt="Mobility Assist"></div><div class="dark"><img class="lock" src="logos/final/mobility-assist-logo-inverted-animated.svg" alt="Mobility Assist"></div></div>
<div class="sizes"><img src="logos/final/mobility-assist-mark-animated.svg" style="width:160px" alt=""><img src="logos/final/mobility-assist-mark-animated.svg" style="width:64px" alt=""><img src="logos/final/mobility-assist-mark-inverted-animated.svg" style="width:64px;background:#072c34;border-radius:12px;padding:6px" alt=""></div></section>
</main></html>
