<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobility Assist logos</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f6;color:#18252a;margin:0;padding:24px}main{max-width:1000px;margin:auto;display:grid;gap:24px}section{background:#fff;border:1px solid #d9e2e3;border-radius:16px;padding:20px}h2{margin:0 0 12px;font-size:18px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.light,.dark{border-radius:12px;padding:24px;display:flex;align-items:center;justify-content:center}.light{background:#fff;border:1px solid #d9e2e3}.dark{background:#072c34}.lock{height:64px;max-width:100%}.sizes{display:flex;gap:20px;align-items:end;margin-top:16px}@media(max-width:640px){.row{grid-template-columns:1fr}}</style>
<main><section><h2>Route arc</h2><div class="row"><div class="light"><img src="logos/a-route-horizontal.svg" class="lock"></div><div class="dark"><img src="logos/a-route-horizontal-inverted.svg" class="lock"></div></div>

<div class="sizes"><img src="logos/b-pin-wheel-mark.svg" style="width:96px"><img src="logos/b-pin-wheel-mark.svg" style="width:48px"><img src="logos/b-pin-wheel-mark.svg" style="width:32px"><img src="logos/b-pin-wheel-mark.svg" style="width:16px"></div></section><section><h2>Forward M</h2><div class="row"><div class="light"><img src="logos/c-monogram-horizontal.svg" class="lock"></div><div class="dark"><img src="logos/c-monogram-horizontal-inverted.svg" class="lock"></div></div>
<div class="sizes"><img src="logos/c-monogram-mark.svg" style="width:96px"><img src="logos/c-monogram-mark.svg" style="width:48px"><img src="logos/c-monogram-mark.svg" style="width:32px"><img src="logos/c-monogram-mark.svg" style="width:16px"></div></section><section><h2>Talk and ride</h2><div class="row"><div class="light"><img src="logos/d-talk-ride-horizontal.svg" class="lock"></div><div class="dark"><img src="logos/d-talk-ride-horizontal-inverted.svg" class="lock"></div></div>
